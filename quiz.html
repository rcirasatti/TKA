<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Latihan TKA SMA</title>
  <!-- Tambah penanda waktu agar HP selalu memuat versi terbaru (tanpa hard refresh) -->
  <script>document.write('<link rel="stylesheet" href="css/style.css?v=' + Date.now() + '">');</script>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <a class="back" href="index.html">← Mapel</a>
      <h1 id="judul">Memuat…</h1>
      <span class="stat" id="stat"></span>
    </header>
    <nav class="nav-nomor" id="nav"></nav>
    <div id="isi"></div>
  </main>

  <script>
    // Muat skrip dengan penanda waktu (urutan tetap terjaga karena async = false).
    (function () {
      var v = Date.now();
      ["js/mapel.js", "js/app.js"].forEach(function (src) {
        var s = document.createElement("script");
        s.src = src + "?v=" + v;
        s.async = false;
        document.body.appendChild(s);
      });
    })();
  </script>
</body>
</html>
