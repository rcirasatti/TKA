<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Latihan TKA SMA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <!-- Tambah penanda waktu agar HP selalu memuat versi terbaru (tanpa hard refresh) -->
  <script>document.write('<link rel="stylesheet" href="css/style.css?v=' + Date.now() + '">');</script>
</head>
<body>
  <header class="bar-atas">
    <div class="wrap bar-isi">
      <a class="back" href="index.html" aria-label="Kembali ke daftar mapel">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </a>
      <div class="judul-wrap">
        <span class="eyebrow" id="sub">Latihan TKA</span>
        <h1 id="judul">Memuat…</h1>
      </div>
      <span class="stat" id="stat"></span>
    </div>
    <div class="progress"><span id="prog" style="width:0"></span></div>
  </header>
  <main class="wrap">
    <nav class="nav-nomor" id="nav" aria-label="Nomor soal"></nav>
    <div id="isi"></div>
  </main>

  <script>
    // Muat skrip dengan penanda waktu (urutan tetap terjaga karena async = false).
    (function () {
      var v = Date.now();
      ["js/mapel.js", "js/app.js"].forEach(function (src) {
        var s = document.createElement("script");
        s.src = src + "?v=" + v;
        s.async = false;
        document.body.appendChild(s);
      });
    })();
  </script>
</body>
</html>
